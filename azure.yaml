# Azure Developer CLI (azd) configuration for All Clear
# Run `azd up` to provision and deploy the solution

name: all-clear
metadata:
  template: all-clear@0.1.0

services:
  backend:
    project: ./backend
    language: python
    host: containerapp
    docker:
      path: Dockerfile
      # Build locally and push directly: ACR Tasks can remain queued on fresh
      # registries, leaving azd up without actionable progress.
      remoteBuild: false

  frontend:
    project: ./frontend
    language: js
    host: containerapp
    docker:
      path: Dockerfile
      remoteBuild: false

# Azure infrastructure
infra:
  provider: bicep
  path: ./infra
  module: main

hooks:
  preprovision:
    shell: sh
    run: |
      echo "Validating the canonical All Clear seed corpus..."
      python scripts/seed_search_index.py --dry-run
  postprovision:
    shell: sh
    run: |
      bash scripts/quickstart.sh --no-smoke || {
        echo "WARNING: Search index seeding is NOT confirmed; review the output and seed the index before the live demo." >&2
        true
      }
  postdeploy:
    shell: sh
    run: |
      echo "Backend URL: ${AZURE_CONTAINERAPP_URL}"
      echo "API Health: ${AZURE_CONTAINERAPP_URL}/api/health"